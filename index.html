<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function navigateTo(path) {
            history.pushState({}, "", path); // Change URL without reloading
            routeIt(); // Call the router function
        }

        function routeIt() {
            const path = window.location.pathname;
            if (path === "/login") {
                document.body.innerHTML = '<h1>LOGIN</h1> <button onclick="navigateTo(\'/\')">Go Back</button>';
            } else if (path === "/register") {
                document.body.innerHTML = '<h1>REGISTER</h1> <button onclick="navigateTo(\'/\')">Go Back</button>';
            } else {
                document.body.innerHTML = `
                    <button onclick="navigateTo('/login')">Login</button>
                    <button onclick="navigateTo('/register')">Register</button>
                `;
            }
        }

        window.addEventListener("popstate", routeIt); // Handle back/forward navigation
        window.addEventListener("load", routeIt); // Run on page load
    </script>
</head>
<body>
    <button onclick="navigateTo('/login')">Login</button>
    <button onclick="navigateTo('/register')">Register</button>
</body>
</html>
